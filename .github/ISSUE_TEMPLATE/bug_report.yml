name: Bug Report
description: Create a report to help us fix a bug or issue in MControlCenter Extra
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much relevant detail as possible to help reproduce and resolve it.

  - type: input
    id: laptop_model
    attributes:
      label: Laptop Model
      description: What is your exact MSI laptop model?
      placeholder: e.g., MSI Modern 14 C7M (MS-14JK), Bravo 15 B5DD, etc.
    validations:
      required: true

  - type: input
    id: distro_kernel
    attributes:
      label: Linux Distribution & Kernel
      description: Run `uname -srm` and `cat /etc/os-release`
      placeholder: e.g., Debian 13 (Trixie), Linux 6.12.117-amd64
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: MControlCenter Version
      description: Which version are you running?
      placeholder: e.g., 0.5.2 (from deb, tarball, or built from source)
    validations:
      required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the problem is.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open MControlCenter Extra
        2. Go to '...'
        3. Click on '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: terminal_output
    attributes:
      label: Terminal Output / Logs
      description: Run `mcontrolcenter` from a terminal and paste any errors or output here.
      render: shell

  - type: checkboxes
    id: driver_checks
    attributes:
      label: Driver Checks
      description: Please verify the status of your kernel drivers:
      options:
        - label: "msi-ec driver is installed and loaded (`cat /sys/devices/platform/msi-ec/shift_mode` returns a value)"
          required: false
        - label: "ec_sys or acpi_ec is loaded with write_support enabled"
          required: false
