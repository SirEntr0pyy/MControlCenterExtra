name: Device Compatibility Report
description: Report test results or compatibility for your MSI laptop model
title: "[Device]: "
labels: ["device-support"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to report how MControlCenter Extra works on your specific MSI laptop model.

  - type: input
    id: laptop_model
    attributes:
      label: Laptop Model & Board
      description: Run `cat /sys/class/dmi/id/product_name` and `cat /sys/class/dmi/id/board_name`
      placeholder: e.g., Modern 14 C7M (MS-14JK)
    validations:
      required: true

  - type: input
    id: ec_version
    attributes:
      label: EC Firmware Version
      description: Displayed in MControlCenter Extra Overview tab or `cat /sys/class/dmi/id/ec_firmware_release`
      placeholder: e.g., 14JKEMS1.501
    validations:
      required: false

  - type: checkboxes
    id: working_features
    attributes:
      label: Working Features
      description: Check all features that work on your laptop:
      options:
        - label: "Performance profile switching (High Performance, Balanced, Silent, Super Battery)"
        - label: "CPU / GPU temperature monitoring"
        - label: "Fan tachometer speed display"
        - label: "Advanced Fan curves / speed controls"
        - label: "Battery charge threshold limits"
        - label: "Keyboard backlight brightness & timeout"
        - label: "Keyboard dynamic lighting effects (Breathing, Heartbeat, Blink)"
        - label: "Hardware Mute LED synchronization"
        - label: "Cooler Boost toggle"
        - label: "Webcam lock toggle"

  - type: textarea
    id: issues_or_notes
    attributes:
      label: Issues, Quirks or Notes
      description: Any specific behavior, quirks, or unsupported features observed.
    validations:
      required: false
